<html>

<head>
    <meta name="color-scheme" content="light dark">
    <!-- Stylesheets to import -->
    <link rel="stylesheet" href="http://netdna.bootstrapcdn.com/bootstrap/3.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.metroui.org.ua/current/icons.css">
    <link href="..//src//stylesheets//simple-iconpicker.css" rel='stylesheet' type='text/css' />
    <link rel="stylesheet" href="../src//stylesheets//metro.css">
    <link rel="stylesheet" href="..//src//stylesheets//style.css">
</head>

<body>
    <div class="howl-iconpicker-outer">
        <div class="howl-iconpicker-middle">
            <div class="howl-iconpicker">
                <div class="howl-closebtn"></div>
                <!-- Selectbox containing all our icon packs -->
                <input type="hidden" id="folder-path"></input>
                <select id="folder-selector" type="text" class="srchicons has-accessible-features" data-role="select">
                    <!-- Value is the name of the icon folder if the regular value contains spaces -->
                    <option value="colored_folders" data-template="<span class='mif-folder1 icon'></span> $1">
                        Colored Folders
                    </option>
                    <option value="application_folder_icons"
                        data-template="<span class='mif-folder-special icon'></span> $1">
                        Application Folder Icons
                    </option>
                    <option value="brand_folder_icons" data-template="<span class='mif-add_business icon'></span> $1">
                        Brand Folder Icons
                    </option>
                    <option value="development_folder_icons"
                        data-template="<span class='mif-important_devices icon'></span> $1">
                        Development Folder Icons
                    </option>
                    <option value="smartphone_folder_icons"
                        data-template="<span class='mif-phonelink-ring icon'></span> $1">
                        Smartphone Folder Icons
                    </option>
                    <option value="other_folder_icons" data-template="<span class='mif-folder-plus icon'></span> $1">
                        Other Folder Icons
                    </option>
                    <option value="filetype_icons" data-template="<span class='mif-pdf-file icon'></span> $1">
                        Filetype Icons
                    </option>
                    <option value="drive_icons" data-template="<span class='mif-drive icon'></span> $1">
                        Drive Icons
                    </option>
                    <option value="brand_icons" data-template="<span class='mif-shop icon'></span> $1">
                        Brand Icons
                    </option>
                    <option value="marketing_icons" data-template="<span class='mif-chart-bars icon'></span> $1">
                        Marketing Icons
                    </option>
                    <option value="programming_icons" data-template="<span class='mif-code icon'></span> $1">
                        Programming Icons
                    </option>
                    <option value="business_icons" data-template="<span class='mif-location-city icon'></span> $1">
                        Business Icons
                    </option>
                    <option value="other_icons" data-template="<span class='mif-plus icon'></span> $1">
                        Other Icons
                    </option>
                </select>
                <!-- Contains the icons of our selected icon pack -->
                <div class="iconsholder" id="icon-container"></div>
            </div>
            <!-- Select icon for folder and close application -->
            <div class="howl-iconpicker-close" id="set-icon-btn"><strong>Change Icon</strong></div>
        </div>
    </div>

    <!-- Display our icon chooser in popup class -->
    <div class="page">
        <div class="popup" />
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <!-- Icons for our select box -->
    <script src="https://cdn.metroui.org.ua/current/metro.js"></script>
    <script>
        //Show the icon picker pop-up on load
        (function ($) {
            $.fn.iconpicker = function () {
                // if user focus on inputbox SHOW iconpicker box
                $(this).focusin(function () {
                    $(".howl-iconpicker-outer").css("display", "table")
                    $(".howl-iconpicker .geticonval").removeClass("selectedicon")

                    whichInput = $(this).attr("class")
                    $(".howl-iconpicker .geticonval").on("click", function () {
                        var getIconId = $(this).text()
                        $(".howl-iconpicker .geticonval").removeClass("selectedicon")
                        $(this).addClass("selectedicon")
                    });
                });
            }
            $(".popup").iconpicker(".popup")
            $('.popup').focus();
        })(jQuery);
    </script>
    <!-- Load our app renderer -->
    <script src="..//src//renderer.js"></script>
</body>

</html>
